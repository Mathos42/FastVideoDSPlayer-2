name: Build nightly

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Exact legacy SDK used for the compatibility build: devkitARM r65-1,
    # libnds 1.8.3-1. Keep the classic FIFO API used by this player.
    container: devkitpro/devkitarm@sha256:a998edf6b06416b5c053edbcd879abfa22b1b88e9cd3f267f5c4ee9fec71a93a
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Make application
        run: |
          make
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v7
        with:
          path: FastVideoDS.nds
